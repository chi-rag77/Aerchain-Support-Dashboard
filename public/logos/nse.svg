<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <!--
    NSE India logo: octagon made of 8 coloured triangles + "NSE" text.
    Colours taken from NSE's brand palette.
  -->
  <!-- Octagon icon (40×40 centred at 20,40, scaled to ~60px tall) -->
  <g transform="translate(4,4)">
    <!-- The octagon is built from 8 triangles meeting at centre -->
    <!-- Centre point: 30,36 -->
    <!-- Octagon vertices (regular, r≈30) roughly at compass points -->
    <!-- Top -->
    <polygon points="30,36 18,6 42,6"   fill="#F7941D"/>
    <!-- Top-right -->
    <polygon points="30,36 42,6 60,18"  fill="#EE3124"/>
    <!-- Right -->
    <polygon points="30,36 60,18 60,54" fill="#C8202F"/>
    <!-- Bottom-right -->
    <polygon points="30,36 60,54 42,66" fill="#F7941D"/>
    <!-- Bottom -->
    <polygon points="30,36 42,66 18,66" fill="#F4C31D"/>
    <!-- Bottom-left -->
    <polygon points="30,36 18,66 0,54"  fill="#3AB54A"/>
    <!-- Left -->
    <polygon points="30,36 0,54 0,18"   fill="#1D71B8"/>
    <!-- Top-left -->
    <polygon points="30,36 0,18 18,6"   fill="#933191"/>
    <!-- White inner octagon to create the hollow look -->
    <polygon
      points="30,36 22,20 30,14 38,20 46,28 46,44 38,52 30,58 22,52 14,44 14,28 22,20"
      fill="white"
    />
    <!-- Smaller white centre -->
    <circle cx="30" cy="36" r="11" fill="white"/>
  </g>

  <!-- "NSE" text -->
  <text
    x="82" y="58"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="48"
    fill="#1D3557"
    letter-spacing="-1"
  >NSE</text>
</svg>
